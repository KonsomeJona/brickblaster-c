name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ffmpeg: the Gradle stageAssets task converts assets/music/*.wav to OGG
      # at packaging time (repo assets stay untouched). Without ffmpeg the APK
      # would ship 82 MB of WAV.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The runner image ships an Android SDK; make sure the exact NDK and
      # CMake versions pinned in app/build.gradle are present.
      - name: Install NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" "cmake;3.22.1" < /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brickblaster-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
