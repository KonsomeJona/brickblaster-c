name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            artifact: brickblaster-linux-x64
            exe: brickblaster
            archive_cmd: tar -czf
            archive_ext: tar.gz
          # GitHub's native ARM runners are free for public repositories.
          - os: ubuntu-24.04-arm
            name: Linux arm64
            artifact: brickblaster-linux-arm64
            exe: brickblaster
            archive_cmd: tar -czf
            archive_ext: tar.gz
          # One universal binary instead of two downloads: CMAKE_OSX_ARCHITECTURES
          # propagates to raylib through FetchContent, so the dependency is fat too.
          - os: macos-latest
            name: macOS universal
            artifact: brickblaster-macos-universal
            exe: brickblaster
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
            archive_cmd: tar -czf
            archive_ext: tar.gz
          - os: windows-latest
            name: Windows x64
            artifact: brickblaster-windows-x64
            exe: brickblaster.exe
            archive_cmd: 7z a
            archive_ext: zip
          - os: windows-11-arm
            name: Windows arm64
            artifact: brickblaster-windows-arm64
            exe: brickblaster.exe
            archive_cmd: 7z a
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        # Quote the -D argument: on the Windows runners this step executes under
        # pwsh, which re-parses the bare token and hands CMake "3" instead of
        # "3.5" ("Invalid CMAKE_POLICY_VERSION_MINIMUM value"). Quoting passes it
        # through verbatim everywhere.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage artifact (Unix)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp build/${{ matrix.exe }} dist/${{ matrix.artifact }}/
          cp -r assets dist/${{ matrix.artifact }}/
          cp README.md LICENSE CHANGELOG.md dist/${{ matrix.artifact }}/
          cd dist && ${{ matrix.archive_cmd }} ${{ matrix.artifact }}.${{ matrix.archive_ext }} ${{ matrix.artifact }}

      - name: Stage artifact (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.artifact }}
          Copy-Item build/Release/${{ matrix.exe }} dist/${{ matrix.artifact }}/
          Copy-Item -Recurse assets dist/${{ matrix.artifact }}/
          Copy-Item README.md,LICENSE,CHANGELOG.md dist/${{ matrix.artifact }}/
          cd dist
          7z a ${{ matrix.artifact }}.${{ matrix.archive_ext }} ${{ matrix.artifact }}

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
